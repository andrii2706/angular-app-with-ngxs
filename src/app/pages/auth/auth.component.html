<div class="relative flex min-h-screen w-full items-center justify-center">
  <div class="flex min-h-screen w-full">
    <div
      class="w-1/2 bg-[url('/images/Gemini_Generated_Image_lrieorlrieorlrie.png')] bg-cover bg-center"
    ></div>

    <div class="w-1/2 bg-[url('/images/photo_2026-02-14_18-37-33.jpg')] bg-cover bg-center"></div>
  </div>

  <div class="bg-base-100 absolute z-10 w-[400px] rounded-xl p-8 shadow-2xl">
    @if (registerForm) {
      <h2 class="mb-6 text-center text-2xl font-bold text-black">Register</h2>
      <app-register (showLogin)="returnToLoginBlock($event)"></app-register>
    } @else {
      <h2 class="mb-6 text-center text-2xl font-bold text-white">Login</h2>
      <form class="flex flex-col gap-4">
        <input
          [formField]="loginCredetialsForm.email"
          type="email"
          placeholder="Input your email"
          class="input w-full"
        />
        <input
          [formField]="loginCredetialsForm.password"
          type="password"
          placeholder="Input your password"
          class="input w-full"
        />
      </form>
      <div class="mt-6 flex flex-col gap-3">
        <button
          class="btn bg-base-200 w-full border border-gray-300 text-white"
          (click)="loginWithCredetials()"
        >
          Login with Email
        </button>

        <button (click)="loginWithGoogle()" class="btn bg-base-200 border-[#e5e5e5] text-white">
          <svg
            aria-label="Google logo"
            width="16"
            height="16"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
          >
            <g>
              <path d="m0 0H512V512H0" fill="#fff"></path>
              <path fill="#34a853" d="M153 292c30 82 118 95 171 60h62v48A192 192 0 0190 341"></path>
              <path fill="#4285f4" d="m386 400a140 175 0 0053-179H260v74h102q-7 37-38 57"></path>
              <path fill="#fbbc02" d="m90 341a208 200 0 010-171l63 49q-12 37 0 73"></path>
              <path
                fill="#ea4335"
                d="m153 219c22-69 116-109 179-50l55-54c-78-75-230-72-297 55"
              ></path>
            </g>
          </svg>
          Login with Google
        </button>
        <button
          class="mt-4 cursor-pointer text-sm text-blue-600 hover:underline"
          (click)="showRegister()"
        >
          Don't have an account? Register
        </button>
      </div>
    }
  </div>
</div>
